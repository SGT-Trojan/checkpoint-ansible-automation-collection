---
- name: Bind the Deployment Agent lease to exactly two inventory members
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the exact Deployment Agent inventory group
      ansible.builtin.assert:
        that:
          - groups["checkpoint_deployment_agent_members"] | default([]) | length == 2
          - >-
            hostvars["localhost"].ansible_connection | default("local")
            in ["local", "ansible.builtin.local"]
          - >-
            hostvars["localhost"].ansible_host | default("localhost")
            in ["localhost", "127.0.0.1", "::1"]
        fail_msg: Deployment Agent observation requires exactly two inventory members.

    - name: Derive the exact runtime member target set
      ansible.builtin.set_fact:
        checkpoint_deployment_agent_live_runtime_targets: >-
          {{
            groups["checkpoint_deployment_agent_members"]
            | map("extract", hostvars, "ansible_host")
            | list
          }}
      no_log: true
      changed_when: false

- name: Observe Deployment Agent state through the reviewed boundary
  hosts: checkpoint_deployment_agent_members
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  roles:
    - role: sgt_trojan.checkpoint_automation.checkpoint_deployment_agent_observation
      vars:
        checkpoint_deployment_agent_live_member_targets: >-
          {{
            hostvars["localhost"][
              "checkpoint_deployment_agent_live_runtime_targets"
            ]
          }}
