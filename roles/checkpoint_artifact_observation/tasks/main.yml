---
- name: Require a genuine local controller target for artifact observation
  ansible.builtin.assert:
    that:
      - checkpoint_artifact_expected_path is string
      - checkpoint_artifact_expected_path | length > 0
      - >-
        hostvars['localhost'].ansible_connection | default('local')
        in ['local', 'ansible.builtin.local']
      - >-
        ansible_connection | default('local')
        in ['local', 'ansible.builtin.local']
      - >-
        hostvars['localhost'].ansible_host | default('localhost')
        in ['localhost', '127.0.0.1', '::1']
      - >-
        ansible_host | default('localhost')
        in ['localhost', '127.0.0.1', '::1']
    fail_msg: Artifact observation requires an exact path and genuine localhost.

- name: Observe one exact local package artifact
  sgt_trojan.checkpoint_automation.cp_automation_artifact_observe:
    expected_path: "{{ checkpoint_artifact_expected_path }}"
  register: checkpoint_artifact_observation
  delegate_to: localhost
  connection: ansible.builtin.local
  become: false
  changed_when: false
