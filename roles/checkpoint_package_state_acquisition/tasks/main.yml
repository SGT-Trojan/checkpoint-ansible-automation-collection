---
- name: Validate inventory-bound package-state acquisition controls
  ansible.builtin.assert:
    that:
      - checkpoint_package_state_step_name is string
      - checkpoint_package_state_step_name | trim | length > 0
      - inventory_hostname is string
      - inventory_hostname | trim | length > 0
      - ansible_host is defined
      - ansible_host is string
      - ansible_host | trim | length > 0
      - ansible_connection in ["httpapi", "ansible.netcommon.httpapi"]
      - ansible_network_os == "check_point.gaia.checkpoint"
      - ansible_checkpoint_target is not defined
      - ansible_httpapi_use_ssl | bool
      - ansible_httpapi_validate_certs is defined
      - ansible_httpapi_validate_certs is boolean
      - checkpoint_package_state_live_lease is mapping
      - >-
        checkpoint_package_state_live_lease.get("tls_validation_mode", "")
        in ["strict", "lab_unverified"]
      - checkpoint_package_state_lab_tls_exception_acknowledged is boolean
      - >-
        (
          checkpoint_package_state_live_lease.get(
            "tls_validation_mode", ""
          ) == "strict"
          and ansible_httpapi_validate_certs is sameas true
          and checkpoint_package_state_lab_tls_exception_acknowledged
              is sameas false
        )
        or
        (
          checkpoint_package_state_live_lease.get("tls_validation_mode", "")
              == "lab_unverified"
          and ansible_httpapi_validate_certs is sameas false
          and checkpoint_package_state_lab_tls_exception_acknowledged
              is sameas true
        )
      - checkpoint_package_state_live_member_targets is sequence
      - checkpoint_package_state_live_member_targets | length == 2
      - >-
        hostvars["localhost"].ansible_connection | default("local")
        in ["local", "ansible.builtin.local"]
      - >-
        hostvars["localhost"].ansible_host | default("localhost")
        in ["localhost", "127.0.0.1", "::1"]
    fail_msg: Package-state acquisition inventory controls are invalid or inconsistent.

- name: Resolve Gaia credential-presence flags without copying values
  ansible.builtin.set_fact:
    checkpoint_package_state_credential_presence:
      gaia_username: >-
        {{
          ansible_user is defined
          and ansible_user is string
          and ansible_user | trim | length > 0
        }}
      gaia_secret: >-
        {{
          ansible_password is defined
          and ansible_password is string
          and ansible_password | trim | length > 0
        }}
  no_log: true

- name: Authorize immediately before the Gaia feature request
  sgt_trojan.checkpoint_automation.cp_automation_package_state_live_preflight:
    lease: "{{ checkpoint_package_state_live_lease }}"
    member_target: "{{ ansible_host }}"
    member_targets: "{{ checkpoint_package_state_live_member_targets }}"
    credential_presence: "{{ checkpoint_package_state_credential_presence }}"
    tls_validation_enabled: "{{ ansible_httpapi_validate_certs }}"
    lab_tls_exception_acknowledged: >-
      {{ checkpoint_package_state_lab_tls_exception_acknowledged }}
  no_log: true
  delegate_to: localhost
  connection: ansible.builtin.local
  become: false

- name: Read supported Gaia API features for package-state acquisition
  check_point.gaia.cp_gaia_features_facts:
    version: "{{ checkpoint_package_state_api_version | default(omit, true) }}"
  register: checkpoint_package_state_gaia_features

- name: Require the Gaia fixed-operation API feature for package-state acquisition
  ansible.builtin.assert:
    that:
      - checkpoint_package_state_gaia_features.ansible_facts.features is sequence
      - >-
        "expert_api_runscript" in
        (checkpoint_package_state_gaia_features.ansible_facts.features
        | map(attribute="name") | map("lower") | list)
    fail_msg: Gaia API does not expose expert_api_runScript.

- name: Authorize immediately before fixed package-state acquisition
  sgt_trojan.checkpoint_automation.cp_automation_package_state_live_preflight:
    lease: "{{ checkpoint_package_state_live_lease }}"
    member_target: "{{ ansible_host }}"
    member_targets: "{{ checkpoint_package_state_live_member_targets }}"
    credential_presence: "{{ checkpoint_package_state_credential_presence }}"
    tls_validation_enabled: "{{ ansible_httpapi_validate_certs }}"
    lab_tls_exception_acknowledged: >-
      {{ checkpoint_package_state_lab_tls_exception_acknowledged }}
  register: checkpoint_package_state_acquisition_authorization
  no_log: true
  delegate_to: localhost
  connection: ansible.builtin.local
  become: false

- name: Acquire fixed package state through Gaia HTTPAPI
  sgt_trojan.checkpoint_automation.cp_automation_package_state_acquire:
    member_address: "{{ ansible_host }}"
    version: "{{ checkpoint_package_state_api_version | default(omit, true) }}"
    timeout_seconds: "{{ checkpoint_package_state_timeout_seconds }}"
    poll_interval_seconds: "{{ checkpoint_package_state_poll_interval_seconds }}"
    max_output_bytes: "{{ checkpoint_package_state_max_output_bytes }}"
    authorization_expires_at: >-
      {{
        checkpoint_package_state_acquisition_authorization
        ["authorization"]["expires_at"]
      }}
  register: checkpoint_package_state_acquired
  no_log: true
  failed_when: false

- name: Stop after a failed package-state acquisition
  ansible.builtin.fail:
    msg: >-
      Package-state acquisition failed
      (category={{ checkpoint_package_state_acquired.category | default("ACQUISITION_UNAVAILABLE") }},
      reason={{ checkpoint_package_state_acquired.reason | default("not-available") }},
      shape={{ checkpoint_package_state_acquired.shape | default(["not-available"]) | join(">") }},
      task_id={{ checkpoint_package_state_acquired.task_id | default("not-submitted-or-unavailable") }}).
  when: checkpoint_package_state_acquired.observation is not defined

- name: Publish the inventory-bound package target state
  ansible.builtin.set_fact:
    checkpoint_package_target_state:
      step_name: "{{ checkpoint_package_state_step_name | trim }}"
      target_id: "{{ inventory_hostname }}"
      installed_packages: "{{ checkpoint_package_state_acquired.observation.installed_packages }}"
      installed_packages_complete: "{{ checkpoint_package_state_acquired.observation.installed_packages_complete }}"
      restore_point_free_bytes: "{{ checkpoint_package_state_acquired.observation.restore_point_free_bytes }}"
  no_log: true
  changed_when: false
