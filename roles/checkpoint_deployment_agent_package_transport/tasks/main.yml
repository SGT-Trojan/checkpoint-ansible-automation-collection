---
- name: Validate Deployment Agent package transport inputs
  ansible.builtin.assert:
    that:
      - inventory_hostname != "localhost"
      - ansible_connection | default("") in ["ssh", "ansible.builtin.ssh"]
      - ansible_host is defined
      - ansible_host is string
      - ansible_host | trim | length > 0
      - checkpoint_deployment_agent_transport_lease is mapping
      - checkpoint_deployment_agent_transport_update_plan is mapping
      - checkpoint_deployment_agent_transport_staging is mapping
      - checkpoint_deployment_agent_transport_member_targets is sequence
      - checkpoint_deployment_agent_transport_member_targets is not string
      - checkpoint_deployment_agent_transport_runtime_commit is string
      - checkpoint_deployment_agent_transport_runtime_commit | length == 40
      - checkpoint_deployment_agent_transport_tls_validation_enabled is boolean
      - >-
        checkpoint_deployment_agent_transport_lab_tls_exception_acknowledged
        is boolean
    fail_msg: >-
      Package transport requires one explicit SSH inventory member and exact
      preflight-bound lease, plan, staging, target, commit, and TLS inputs.

- name: Transport one exact Deployment Agent package without installing it
  sgt_trojan.checkpoint_automation.cp_automation_deployment_agent_package_transport:
    lease: "{{ checkpoint_deployment_agent_transport_lease }}"
    update_plan: "{{ checkpoint_deployment_agent_transport_update_plan }}"
    staging: "{{ checkpoint_deployment_agent_transport_staging }}"
    member_targets: "{{ checkpoint_deployment_agent_transport_member_targets }}"
    runtime_commit: "{{ checkpoint_deployment_agent_transport_runtime_commit }}"
    tls_validation_enabled: >-
      {{ checkpoint_deployment_agent_transport_tls_validation_enabled }}
    lab_tls_exception_acknowledged: >-
      {{
        checkpoint_deployment_agent_transport_lab_tls_exception_acknowledged
      }}
  register: checkpoint_deployment_agent_transport_result
  become: false
  no_log: true

- name: Publish sanitized firewall-local package evidence
  ansible.builtin.set_fact:
    checkpoint_deployment_agent_transport: >-
      {{ checkpoint_deployment_agent_transport_result.transport }}
    checkpoint_deployment_agent_transport_authorization: >-
      {{ checkpoint_deployment_agent_transport_result.authorization }}
  changed_when: false
